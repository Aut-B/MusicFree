name: 构建 Kumone 备份恢复版 APK

on:
  push:
    branches: [dev-kumone-restore]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache React Native dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-rn-${{ hashFiles('package-lock.json', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-rn-

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      # 自用构建：没有正式签名证书，现场生成一个。装过一次之后，
      # 后续更新必须用同一把密钥，所以后续版本请在本工作流里换成固定证书。
      - name: Generate signing key
        run: |
          keytool -genkeypair -v -keystore android/app/release.keystore \
            -alias musicfree -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MusicFree, OU=Dev, O=Dev, L=, S=, C=CN"
          cat > android/keystore.properties << 'EOF'
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=android
          RELEASE_KEY_ALIAS=musicfree
          RELEASE_KEY_PASSWORD=android
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --parallel

      - name: List generated APKs
        run: |
          echo "Generated APK files:"
          find android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: musicfree-kumone-apk
          # ABI splits 会把包放到 apk/<abi>/release/ 子目录，用 ** 才能全覆盖
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      # Actions 产物的下载域名在国内网络下不稳定，另发一份到 Release。
      - name: Publish dev release (APK visible on Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kumone-restore-${{ github.run_number }}
          name: Kumone 备份恢复版 #${{ github.run_number }}
          body: |
            自动化构建。安装 universal 包即可（任意 ABI 通用）；
            按机型下载对应包体积更小。
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/**/*universal*.apk
            android/app/build/outputs/apk/**/*arm64-v8a*.apk
            android/app/build/outputs/apk/**/*armeabi-v7a*.apk
